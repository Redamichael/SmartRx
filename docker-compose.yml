version: "3.9"

# ══════════════════════════════════════════════════════════════
#  SmartRx AI — Docker Compose
#  AI Decision Intelligence for Ethiopia's Digital Health
#  Run: docker-compose up --build
# ══════════════════════════════════════════════════════════════

services:

  # ── Backend API ──────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartrx-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://smartrx:smartrx2024@db:5432/smartrx
      - AT_API_KEY=${AT_API_KEY:-demo_key}
      - AT_USERNAME=${AT_USERNAME:-smartrx_ethiopia}
      - AT_SANDBOX=${AT_SANDBOX:-true}
      - SECRET_KEY=${SECRET_KEY:-smartrx-secret-2024-ethiopia}
      - PORT=8000
    volumes:
      - ./ml/models:/app/ml/models
      - ./smartrx_demo.db:/app/smartrx_demo.db  # SQLite fallback
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ── PostgreSQL ───────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: smartrx-db
    environment:
      POSTGRES_DB:       smartrx
      POSTGRES_USER:     smartrx
      POSTGRES_PASSWORD: smartrx2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartrx"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Frontend (Nginx) ─────────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: smartrx-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  # ── ML Training (one-shot) ───────────────────────────────
  ml-train:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartrx-ml-train
    command: >
      sh -c "python3 ml/forecasting/train_lstm.py &&
             python3 ml/anomaly_detection/train_autoencoder.py &&
             echo 'ML training complete'"
    volumes:
      - ./ml/models:/app/ml/models
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - train   # only runs with: docker-compose --profile train up ml-train

volumes:
  postgres_data:
